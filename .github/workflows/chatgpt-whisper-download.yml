name: ChatGPT Whisper Base
on:
  push:
    branches:
      - chatgpt-whisper-temp

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download faster-whisper base multilingual model
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir huggingface-hub
          mkdir -p bundle/model
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(
              repo_id="Systran/faster-whisper-base",
              local_dir="bundle/model",
          )
          PY
          du -sh bundle/model
          ls -lh bundle/model

      - name: Upload base model
        uses: actions/upload-artifact@v4
        with:
          name: faster-whisper-base-model
          path: bundle/model
          compression-level: 0
          retention-days: 1
